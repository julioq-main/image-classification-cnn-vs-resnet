seed: 1234
log_file: "experiments/testing/testing.log"
log_level: "DEBUG"
save_dir: "experiments/testing"

data:
 train_dir: "data/processed/train"
 test_dir: "data/processed/test"
 val_dir: "data/processed/val"
 mean: [0.4963, 0.4963, 0.4894]
 std: [0.2304, 0.2314, 0.2542]
 batch_size: 32
 num_workers: 4
 image_size: 224
 resize_size: 256
 drop_last: true
 augmentations:
  - name: RandomResizeCrop
    params:
     size: 224
  - name: RandomHorizontalFlip
    params:
     p: 0.5

model: 
 name: "resnet"
 num_classes: 25

training:
 optimizer:
  name: "sgd"
  lr: 0.001
  momentum: 0.9
 
 epochs: 2
 loss_goal: 0.1
 patience: 5

eval:
 advanced_metrics: true

