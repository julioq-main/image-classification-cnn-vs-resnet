seed: 42
log_level: "INFO"
log_file: "experiments/exp009/exp009.log"
save_dir: "experiments/exp009"

data:
  train_dir: "data/architectural_styles/processed/train"
  test_dir: "data/architectural_styles/processed/test"
  val_dir: "data/architectural_styles/processed/val"
  mean: [0.4963, 0.4963, 0.4894]
  std: [0.2304, 0.2314, 0.2542]
  batch_size: 32
  num_workers: 4
  image_size: 224
  resize_size: 256
  drop_last: true
  augmentations:
  - name: RandomResizedCrop
    params:
      size: 224
  - name: RandomHorizontalFlip
    params:
      p: 0.5
  - name: ColorJitter
    params:
      brightness: 0.4
      contrast: 0.4
      saturation: 0.4
      hue: 0.1
  - name: RandomRotation
    params:
      degrees: 30
  - name: RandomGrayscale
    params:
      p: 0.1


model: 
  name: "convnext_tiny"
  num_classes: 25
  pretrained: true

train:
  epochs: 50
  loss_goal: 0.1
  patience: 10
  checkpoint_interval: 10
  optimizer:
    name: "adamw"
    lr: 0.0001
    wight_decay: 0.001
    scheduler:
      name: "cosine"
      T_max: 50

  advanced_metrics: true
  plotting:
    enabled: true
    advanced_metrics: true

test:
  advanced_metrics: true
  plotting:
    enabled: true